# Server Configuration
server.port=8080
server.servlet.context-path=/api

# =============================================================================
# 敏感配置管理规则
#
# 所有密码、API Key、JWT 密钥等敏感信息统一存放在 application-secrets.properties 中。
# 该文件已被 .gitignore 排除，不会提交到版本控制。
#
# 初次使用请执行：
#   cp application-secrets.properties.example application-secrets.properties
# 然后编辑 application-secrets.properties 填入真实值。
# =============================================================================
spring.config.import=optional:classpath:application-secrets.properties

# Database Configuration (敏感信息: 密码 → secrets)
spring.datasource.url=jdbc:mysql://localhost:3306/xiaohongshu?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# JWT Configuration (敏感信息: secret → secrets)
jwt.expiration=86400000

# File Storage Location
file.upload-dir=${user.dir}/uploads

# DeepSeek AI Configuration (敏感信息: API Key → secrets)
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-v4-flash
