# =============================================================================
# Render 生产环境配置
# 这些值通过 Render Dashboard 的环境变量覆盖
# =============================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# TiDB Cloud Serverless Database (MySQL-compatible)
# 在 Render Dashboard 设置环境变量:
#   SPRING_DATASOURCE_URL=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/xiaohongshu?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
#   SPRING_DATASOURCE_USERNAME=xxxxx.root
#   SPRING_DATASOURCE_PASSWORD=your_password
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# File Upload - Render uses ephemeral storage, files will be lost on restart
# Recommended: Use cloud storage (S3/Cloudinary) for production
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
file.upload-dir=/opt/render/project/uploads

# JWT
jwt.secret=${JWT_SECRET:change-me-in-production-32-chars-lorem-ipsum-dolor-sit-amet}
jwt.expiration=86400000

# CORS - 允许 Vercel 前端域名
# 在 Render Dashboard 设置:
#   CORS_ALLOWED_ORIGINS=https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://essencity.vercel.app}

# DeepSeek AI (optional - set DEEPSEEK_API_KEY in Render env vars)
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-v4-flash
