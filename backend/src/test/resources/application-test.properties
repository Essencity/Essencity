# Servlet Context Path (must match production)
server.servlet.context-path=/api

# Test Database Configuration - Using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# File Upload Configuration
file.upload-dir=./test-uploads

# SQL Initialization
spring.sql.init.mode=never

# DeepSeek AI Configuration (mocked in tests)
deepseek.api-key=test-api-key
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-v4-flash

# JWT Configuration (for tests)
jwt.secret=test-jwt-secret-key-for-testing-only-1234567890
jwt.expiration=86400000
